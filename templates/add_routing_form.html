<!DOCTYPE html>
<html>
<head>
    <title>Ajouter accès interne</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>Ajouter un accès pour accèder au routeur</h2>
    <form action="/add_routing_rule" method="POST">
        <label>IP source : 
            <input type="text" name="ip_source" pattern="^([0-9]{1,3}\.){3}[0-9]{1,3}(/[0-9]{1,2})?$" title="Format IP valide comme 127.0.0.1 ou 192.168.1.1/24" required>
        </label>
        <br><br>

        <label>IP destination : 
            <input type="text" name="ip_dest" pattern="^([0-9]{1,3}\.){3}[0-9]{1,3}(/[0-9]{1,2})?$" title="Format IP valide comme 127.0.0.1 ou 192.168.1.1/24" required>
        </label>
        <br><br>
        
        <label>Protocole : 
            <select name="protocol" id="protocol" required onchange="togglePorts()">
                <option value="">Sélectionner un protocole</option>
                <option value="tcp">TCP</option>
                <option value="udp">UDP</option>
                <option value="ping">PING</option>
            </select>
        </label>
        <br><br>
        
        <div id="portsDiv">
            <label>Ports : 
                <input type="number" name="port" min="1" max="65535" title="Port valide : 1 à 65535">
            </label>
        </div>
        <br><br>
        
        <button type="submit">Ajouter</button>
        <button type="button" onclick="window.close()">Fermer</button>
    </form>

    <script>
        function togglePorts() {
            var protocol = document.getElementById('protocol').value;
            var portsDiv = document.getElementById('portsDiv');
            
            // Afficher les ports uniquement pour TCP ou UDP
            if (protocol === 'tcp' || protocol === 'udp') {
                portsDiv.style.display = 'block';
                // Rendre le champ required
                document.querySelector('input[name="port"]').required = true;
            } else {
                portsDiv.style.display = 'none';
                // Enlever required pour ICMP
                document.querySelector('input[name="port"]').required = false;
                // Vider la valeur
                document.querySelector('input[name="port"]').value = '';
            }
        }

        // Cacher les ports au chargement de la page
        document.addEventListener('DOMContentLoaded', function() {
            togglePorts();
        });
    </script>
</body>
</html>
